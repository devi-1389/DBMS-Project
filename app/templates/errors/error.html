{% extends 'base.html' %}
{% block title %}{{ error_code }} · {{ error_title }} | SOLACE{% endblock %}
{% block content %}
<section class="section">
    <div class="container" style="max-width: 720px;">
        <div class="card-lux card-pad text-center p-5">
            <div class="font-serif" style="font-size: 5rem; line-height: 1; color: var(--gold-500);">{{ error_code }}</div>
            <h1 class="h2 mt-2">{{ error_title }}</h1>
            <p class="text-muted mb-4">{{ error_message }}</p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a href="{{ url_for('index') }}" class="btn btn-gold"><i class="bi bi-house me-1"></i> Return Home</a>
                <a href="{{ url_for('experience.catalogue') }}" class="btn btn-ghost">Browse Experiences</a>
                <button type="button" class="btn btn-ghost" onclick="history.back()">Go Back</button>
            </div>
        </div>
    </div>
</section>
{% endblock %}
